name: Formatter checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sv-format:
    name: Check SystemVerilog formatting with Verible
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - uses: chipsalliance/verible-formatter-action@main
      with:
        verible_version: "v0.0-4023-gc1271a00"
        fail_on_formatting_suggestions: true
        parameters: # These should be the same as in util/verible-format.py
          --formal_parameters_indentation=indent
          --named_parameter_indentation=indent
          --named_port_indentation=indent
          --port_declarations_indentation=indent
        github_token: ${{ secrets.GITHUB_TOKEN }}
  
  python-format:
    name: Check Python formatting with Black
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: psf/black@stable
      with:
        options: "--check --verbose"
        version: "~=24.8"
        src: >
          test/
